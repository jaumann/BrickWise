name: app

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Typecheck and drive the app end to end against the engine from source.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "engine[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run lint
        working-directory: app
      - run: npm run typecheck
        working-directory: app
      - run: npm run build
        working-directory: app
      # Ubuntu's AppArmor rules stop Chromium's sandbox from starting otherwise.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: xvfb-run -a npm test
        working-directory: app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-linux
          path: app/test-results/

  # Build the Mac app with the engine bundled, test that build, and keep the .dmg.
  mac:
    runs-on: macos-latest
    env:
      # Ad hoc signing uses no secrets, so it is safe on pull requests too.
      CSC_FOR_PULL_REQUEST: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "engine[dev,package]"
      - run: python engine/packaging/build.py
      - run: engine/dist/brickwise-engine/brickwise-engine --version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run package -- --mac
        working-directory: app
      - run: npm test
        working-directory: app
        env:
          BRICKWISE_APP: ${{ github.workspace }}/app/dist/mac-arm64/BrickWise.app/Contents/MacOS/BrickWise
          BRICKWISE_PYTHON: python
      - uses: actions/upload-artifact@v4
        with:
          name: BrickWise-mac
          path: app/dist/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-mac
          path: app/test-results/
