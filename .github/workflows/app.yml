name: app

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Typecheck and drive the app end to end against the engine from source.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "engine[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run lint
        working-directory: app
      - run: npm run typecheck
        working-directory: app
      - run: npm run build
        working-directory: app
      # Ubuntu's AppArmor rules stop Chromium's sandbox from starting otherwise.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: xvfb-run -a npm test
        working-directory: app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-linux
          path: app/test-results/

  # Build the Mac app for each architecture with the engine bundled, test it, and keep the .dmg.
  mac:
    name: mac (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: apple-silicon
            runner: macos-latest
            arch: arm64
            cpu: arm64
            out: mac-arm64
          - name: intel
            runner: macos-15-intel
            arch: x64
            cpu: x86_64
            out: mac
    runs-on: ${{ matrix.runner }}
    env:
      # Ad hoc signing uses no secrets, so it is safe on pull requests too.
      CSC_FOR_PULL_REQUEST: "true"
      # Electron 44 needs macOS 13, so the engine shouldn't need anything newer.
      MIN_MACOS: "13.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pip would pick wheels built for the runner's macOS, which can refuse to load on older Macs.
      - run: >
          pip download --dest wheels --only-binary=:all: --platform macosx_${MIN_MACOS/./_}_${{ matrix.cpu }}
          --python-version 3.12 --implementation cp --abi cp312 numpy opencv-python-headless pypdfium2
      - run: pip install --no-index --find-links wheels numpy opencv-python-headless pypdfium2
      - run: pip install -e "engine[dev,package]"
      - run: python engine/packaging/build.py
      - run: engine/dist/brickwise-engine/brickwise-engine --version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run package -- --mac --${{ matrix.arch }}
        working-directory: app
      - run: python engine/packaging/check_macos.py app/dist/${{ matrix.out }}/BrickWise.app --arch ${{ matrix.cpu }} --max $MIN_MACOS
      - run: npm test
        working-directory: app
        env:
          BRICKWISE_APP: ${{ github.workspace }}/app/dist/${{ matrix.out }}/BrickWise.app/Contents/MacOS/BrickWise
          BRICKWISE_PYTHON: python
      - uses: actions/upload-artifact@v4
        with:
          name: BrickWise-mac-${{ matrix.name }}
          path: app/dist/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-mac-${{ matrix.name }}
          path: app/test-results/
